<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Orbital Debris Viewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Exo+2:wght@300;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Exo 2', sans-serif;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    #tooltip {
      position: fixed;
      padding: 12px 18px;
      background: linear-gradient(135deg, rgba(20,15,30,0.95) 0%, rgba(40,25,50,0.9) 100%);
      border: 1px solid rgba(255, 200, 100, 0.35);
      border-radius: 10px;
      color: #ffd89e;
      font-size: 14px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      max-width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(255,180,80,0.1);
      z-index: 100;
    }
    #tooltip.visible { opacity: 1; }
    #tooltip .name { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 15px; margin-bottom: 6px; color: #fff5e0; }
    #tooltip .type { text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; color: rgba(255,220,150,0.9); margin-bottom: 4px; }
    #tooltip .detail { font-size: 12px; color: rgba(255,230,180,0.85); }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity 0.5s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading p { color: rgba(255,200,120,0.9); font-size: 16px; margin-top: 16px; }
    .spinner { width: 48px; height: 48px; border: 3px solid rgba(255,180,80,0.2); border-top-color: #e8a030; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="tooltip">
    <div class="name"></div>
    <div class="type"></div>
    <div class="detail"></div>
  </div>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading…</p>
  </div>

  <script>
    (function() {
      console.log('[Gravity] HTML loaded, waiting for main.js module…');
      var loader = document.getElementById('loading');
      function hide() { if (loader) loader.classList.add('hidden'); }
      setTimeout(function() { hide(); console.log('[Gravity] Loading overlay force-hidden after 2.5s'); }, 2500);
    })();
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
